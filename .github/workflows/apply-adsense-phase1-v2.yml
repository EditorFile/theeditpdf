name: Apply AdSense Phase 1 patch v2 (temporary)
on:
  push:
    branches: [adsense-phase1-web]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense-phase1-web
      - name: Apply remaining 66 files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import re
          text = open('adsense-phase1.patch').read()
          parts = re.split(r'(?m)^(?=diff --git )', text)
          kept = []
          for part in parts:
              if part.startswith('diff --git ') and 'privacy/index.html' in part.splitlines()[0]:
                  continue
              if part.startswith('diff --git '):
                  kept.append(part)
          open('filtered.patch', 'w').write(''.join(kept))
          print(f"kept diff sections: {len(kept)}")
          PY
          git apply --check filtered.patch
          git apply filtered.patch
          git diff --name-only | tee changed.txt
          test "$(wc -l < changed.txt)" -eq 66
          if grep -qx 'privacy/index.html' changed.txt; then echo 'privacy must not change'; exit 1; fi
          if grep -qx 'google217c664b92a9bb43.html' changed.txt; then echo 'forbidden file changed'; exit 1; fi
          if grep -qx 'vercel.json' changed.txt; then echo 'forbidden file changed'; exit 1; fi
          rm -f filtered.patch changed.txt
          git rm -q adsense-phase1.patch .github/workflows/apply-adsense-phase1-v2.yml
          git add -A
          git diff --cached --name-only | tee staged.txt
          test "$(wc -l < staged.txt)" -eq 68
          if grep -qx 'privacy/index.html' staged.txt; then echo 'privacy must not change'; exit 1; fi
          rm -f staged.txt
          git commit -m "AdSense Phase 1 (67 of 67): apply remaining 66 files from patch" -m "Bulk application on adsense-phase1-web only. privacy/index.html was already done and is not re-applied. Temporary patch and workflow files removed in this commit. NOT merged to main yet."
          git push origin adsense-phase1-web
